name: leak-check

# Server-side leak scan. Runs on every push to main and on every pull request.
# The pattern list is held as a repository secret (LEAK_PATTERNS_JSON, base64 of
# a {"patterns":[{"id","category","regex","flags"}...]} document) so the specific
# values the project does not want public are not themselves in the repo.
# A pull request sent from a fork does NOT receive secrets, and the check is
# skipped there with a visible note; a maintainer re-runs the check from a trusted
# branch before merge. Every other run does receive them, so an empty secret there
# means the secret is missing and the scan fails rather than passing unscanned.
# Dependabot runs receive Dependabot secrets, not Actions secrets: if Dependabot is
# enabled, add LEAK_PATTERNS_JSON as a Dependabot secret too, or its runs fail here.

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode patterns and scan the tree
        env:
          LEAK_PATTERNS_JSON_B64: ${{ secrets.LEAK_PATTERNS_JSON }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${LEAK_PATTERNS_JSON_B64:-}" ]; then
            if [ "$FORK_PR" = "true" ]; then
              echo "::warning::LEAK_PATTERNS_JSON is not passed to a pull request from a fork. Skipping scan."
              exit 0
            fi
            echo "::error::LEAK_PATTERNS_JSON is empty on a run that receives repository secrets; the secret is missing."
            exit 3
          fi
          mkdir -p "$RUNNER_TEMP/lc"
          echo "$LEAK_PATTERNS_JSON_B64" | base64 -d > "$RUNNER_TEMP/lc/patterns.json"
          python3 - "$RUNNER_TEMP/lc/patterns.json" <<'PY'
          import json, os, re, subprocess, sys
          MAX_FILE_BYTES = 2_000_000
          with open(sys.argv[1]) as fh:
              spec = json.load(fh)
          patterns = []
          for entry in spec.get("patterns", []):
              flags = re.IGNORECASE if "i" in entry.get("flags", "") else 0
              patterns.append((entry["id"], re.compile(entry["regex"], flags)))
          assert patterns, "no patterns loaded"
          names = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          findings = 0
          for rel in names:
              if not rel:
                  continue
              try:
                  if os.path.getsize(rel) > MAX_FILE_BYTES:
                      continue
                  with open(rel, "rb") as fh:
                      data = fh.read()
              except OSError:
                  continue
              if b"\x00" in data[:8192]:
                  continue
              text = data.decode("utf-8", errors="replace")
              for number, line in enumerate(text.splitlines(), 1):
                  for pid, rx in patterns:
                      if rx.search(line):
                          print(f"{rel}:{number}: {pid}: {line[:160]}")
                          findings += 1
          print(f"scanned {sum(1 for n in names if n)} tracked file(s); {findings} finding(s).")
          sys.exit(1 if findings else 0)
          PY

  # The text scan above reads files only, so a commit's author and committer pass it, and a merge or
  # squash made on GitHub is authored with the account's commit email without the pre-push hook ever
  # seeing it. This job reads the commits the push or pull request adds, with the same secret pattern
  # list, and reports commit + field + pattern id (never the matched text). On a push it runs after
  # the fact: a merge GitHub made is already on the branch when this turns red. Commit messages are
  # read against the robot category only (see author_scan.py for why not every pattern), so a push
  # that skipped the local pre-push hook is still refused for a robot name in a message.
  authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Commits added by this push or pull request
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        shell: bash
        run: bash .github/leak-check/push_range.sh
      - name: Author scan self-test (the scan must be able to find a planted canary)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/leak-check -p 'test_author_scan.py' -v
          python3 .github/leak-check/author_scan.py --self-test
      - name: Decode patterns and scan the commits
        env:
          LEAK_PATTERNS_JSON_B64: ${{ secrets.LEAK_PATTERNS_JSON }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          BASE: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${LEAK_PATTERNS_JSON_B64:-}" ]; then
            if [ "$FORK_PR" = "true" ]; then
              echo "::warning::LEAK_PATTERNS_JSON is not passed to a pull request from a fork. Skipping author scan."
              exit 0
            fi
            echo "::error::LEAK_PATTERNS_JSON is empty on a run that receives repository secrets; the secret is missing."
            exit 3
          fi
          mkdir -p "$RUNNER_TEMP/lc"
          echo "$LEAK_PATTERNS_JSON_B64" | base64 -d > "$RUNNER_TEMP/lc/patterns.json"
          python3 .github/leak-check/author_scan.py --patterns "$RUNNER_TEMP/lc/patterns.json" \
            --head "$HEAD_SHA" ${BASE:+--base "$BASE"} --message-category robot

  # The text scan above skips binary files, so a name drawn into a plot legend or a photo caption
  # passes it. This job OCRs only the images the push or pull request adds or modifies, with the
  # same secret pattern list, and reports path + pattern id (never the matched text).
  images:
    runs-on: ubuntu-latest
    # Debian 13 ships tesseract 5.5.0 and the eng.traineddata the vendored OCR library pins; the Ubuntu
    # runner's tesseract is older and would be refused as unpinned (a fault, never a pass).
    container: debian:trixie
    steps:
      - name: Install git, tesseract and Pillow
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git python3 python3-pil \
            tesseract-ocr tesseract-ocr-eng > /dev/null
          tesseract --version | head -1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Image scan self-test (runs on every push, so the instrument proves it can fail)
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m unittest discover -s .github/leak-check -p 'test_image_scan.py' -v
          python3 .github/leak-check/image_scan.py --patterns /dev/null --self-test
      - name: List images added or modified
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/changed-images"
          # Same base as the authors job (see push_range.sh). On a pull request it is the base
          # branch, and the diff runs to the trial merge, so main's own changes are not counted.
          GITHUB_OUTPUT="$RUNNER_TEMP/range" bash .github/leak-check/push_range.sh
          base="$(sed -n 's/^base=//p' "$RUNNER_TEMP/range")"
          if [ -z "$base" ]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          git diff --name-only -z --no-renames --diff-filter=ACMT "$base" HEAD -- \
            '*.png' '*.PNG' '*.jpg' '*.JPG' '*.jpeg' '*.JPEG' '*.gif' '*.GIF' '*.webp' '*.WEBP' \
            > "$list"
          count="$(tr -cd '\0' < "$list" | wc -c | tr -d ' ')"
          echo "base $base; $count image(s) added or modified."
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Decode patterns and OCR the changed images
        if: steps.changed.outputs.count != '0'
        env:
          LEAK_PATTERNS_JSON_B64: ${{ secrets.LEAK_PATTERNS_JSON }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          LIST: ${{ steps.changed.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${LEAK_PATTERNS_JSON_B64:-}" ]; then
            if [ "$FORK_PR" = "true" ]; then
              echo "::warning::LEAK_PATTERNS_JSON is not passed to a pull request from a fork. Skipping image scan."
              exit 0
            fi
            echo "::error::LEAK_PATTERNS_JSON is empty on a run that receives repository secrets; the secret is missing."
            exit 3
          fi
          mkdir -p "$RUNNER_TEMP/lc"
          echo "$LEAK_PATTERNS_JSON_B64" | base64 -d > "$RUNNER_TEMP/lc/patterns.json"
          python3 .github/leak-check/image_scan.py --patterns "$RUNNER_TEMP/lc/patterns.json" \
            --root . --list "$LIST"
